ние аккаунта не останавливает её автоматически.", "app_title": "Способ 1: в приложении", "app_text": "Qarznoma → Настройки → «Удалить аккаунт» → отметьте «Понимаю» → «Удалить аккаунт».", "form_title": "Способ 2: запрос на этой странице", "form_text": "Если приложение не установлено, введите логин и пароль.", "form_safety": "Аккаунт не удаляется сразу. Чтобы ваши данные не удалил посторонний, узнавший пароль, администратор позвонит вам, подтвердит запрос и после этого удалит аккаунт в течение 30 дней. Если связаться с вами не удастся, аккаунт не будет удалён.", "login": "Логин", "password": "Пароль", "phone": "Ваш номер телефона (администратор позвонит)", "confirm": "Понимаю: после подтверждения аккаунт и все данные будут удалены безвозвратно", "submit": "Отправить запрос на удаление", "working": "Отправка…", "ok": "Запрос принят. Администратор свяжется с вами по телефону и после подтверждения удалит аккаунт. Если запрос отправили не вы, откажитесь во время звонка.", "err_creds": "Неверный логин или пароль.", "err_exists": "Запрос для этого аккаунта уже отправлен. Администратор свяжется с вами.", "err_limit": "Слишком много попыток. Попробуйте немного позже.", "err_generic": "Не удалось отправить запрос. Проверьте интернет и попробуйте снова или свяжитесь с нами.", "err_fill": "Введите логин, пароль и номер телефона и поставьте отметку подтверждения.", "contact_title": "Способ 3: если у вас нет пароля", "contact_text": "Если вы входили через Google или забыли пароль, удалите аккаунт в приложении или напишите нам. После подтверждения, что аккаунт ваш, запрос будет выполнен в течение 30 дней:", "privacy_link": "Политика конфиденциальности", "theme": "Тема"}, "en": {"title": "Delete account", "lead": "You can delete your Qarznoma account and all your data on the server. This cannot be undone.", "what_title": "What is deleted", "what": ["Account: login, name, plan and its expiry", "Debtors and debt history", "Finance records, categories, tags and savings goals", "Notes", "Connected devices, payment history and message read status"], "what_note": "Data is deleted completely and nothing is retained: immediately with option 1, after administrator confirmation with options 2 and 3. The copy on your phone stays until you uninstall the app or tap Settings → \"Delete data\".", "sub_note": "If you bought a plan through Google Play, cancel the subscription in Google Play separately — deleting the account does not stop it automatically.", "app_title": "Option 1: in the app", "app_text": "Qarznoma → Settings → \"Delete account\" → tick \"I understand\" → \"Delete account\".", "form_title": "Option 2: send a request on this page", "form_text": "If the app is not installed, enter your login and password.", "form_safety": "The account is not deleted immediately. So that someone who learned your password cannot erase your data, an administrator will call you to confirm the request and will then delete the account within 30 days. If we cannot reach you, the account is not deleted.", "login": "Login", "password": "Password", "phone": "Your phone number (the administrator will call)", "confirm": "I understand: once confirmed, the account and all data will be deleted permanently", "submit": "Send deletion request", "working": "Sending…", "ok": "Your request has been received. An administrator will call you and delete the account after confirming. If you did not send this request, decline it on the call.", "err_creds": "Wrong login or password.", "err_exists": "A request for this account has already been sent. An administrator will contact you.", "err_limit": "Too many attempts. Please try again a bit later.", "err_generic": "Could not send the request. Check your internet connection and try again, or contact us.", "err_fill": "Enter your login, password and phone number and tick the confirmation box.", "contact_title": "Option 3: if you have no password", "contact_text": "If you signed in with Google or forgot your password, delete the account in the app or write to us. Once we confirm the account is yours, the request will be completed within 30 days:", "privacy_link": "Privacy policy", "theme": "Theme"}};
const THEME_L={'uz':["Tungi rejim","Kunduzgi rejim"],'uz-Cyrl':["Тунги режим","Кундузги режим"],
'ru':["Тёмная тема","Светлая тема"],'en':["Dark mode","Light mode"]};
const FOOT={'uz':["Maxfiylik siyosati","Akkauntni o'chirish"],'uz-Cyrl':["Махфийлик сиёсати","Аккаунтни ўчириш"],
'ru':["Политика конфиденциальности","Удаление аккаунта"],'en':["Privacy policy","Delete account"]};
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function pickLang(){try{const q=new URLSearchParams(location.search).get('lang');if(q&&T[q])return q}catch(e){}
try{const s=localStorage.getItem('qz_lang');if(s&&T[s])return s}catch(e){}
const n=(navigator.language||'uz').toLowerCase();if(n.startsWith('ru'))return'ru';if(n.startsWith('en'))return'en';
if(n.startsWith('uz-cyrl'))return'uz-Cyrl';return'uz'}
let lang=pickLang();
function curTheme(){return document.documentElement.getAttribute('data-theme')||
(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function setTheme(t){const r=document.documentElement;if(t)r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
try{t?localStorage.setItem('qz_theme',t):localStorage.removeItem('qz_theme')}catch(e){}themeBtn()}
try{const t=localStorage.getItem('qz_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
function toggleTheme(){setTheme(curTheme()==='dark'?'light':'dark')}
/* Tugma bosilganda NIMA bo'lishini ko'rsatadi: yorug'da "🌙 Tungi rejim", qorong'ida "☀ Kunduzgi rejim" */
function themeBtn(){const b=document.getElementById('themeBtn');if(!b)return;const dark=curTheme()==='dark';
const lbl=THEME_L[lang][dark?1:0];b.innerHTML=(dark?SUN:MOON)+'<span class="lbl">'+lbl+'</span>';
b.setAttribute('aria-label',lbl);b.title=lbl}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeBtn)}catch(e){}
/* Til menyusi — brauzerning oddiy <select> ro'yxati bezatib bo'lmaydi, shuning uchun o'zimizniki */
const CODES={'uz':'UZ','uz-Cyrl':'ЎЗ','ru':'RU','en':'EN'};
const CHECK='<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
function menuOpen(open){const b=document.getElementById('langBtn'),m=document.getElementById('langMenu');
m.hidden=!open;b.setAttribute('aria-expanded',open);
if(open){const cur=m.querySelector('[aria-selected="true"]')||m.firstChild;cur.focus()}}
function pickFromMenu(code){lang=code;try{localStorage.setItem('qz_lang',code)}catch(e){}
try{const u=new URL(location.href);u.searchParams.set('lang',code);history.replaceState(null,'',u)}catch(e){}
menuOpen(false);document.getElementById('langBtn').focus();render()}
function initLangMenu(){const b=document.getElementById('langBtn'),m=document.getElementById('langMenu');
m.innerHTML=LANGS.map(([c,n])=>'<li role="option" tabindex="-1" data-code="'+c+'"><span class="code">'+CODES[c]+
'</span><span class="nm">'+n+'</span>'+CHECK+'</li>').join('');
b.onclick=e=>{e.stopPropagation();menuOpen(m.hidden)};
m.onclick=e=>{const li=e.target.closest('li');if(li)pickFromMenu(li.dataset.code)};
document.addEventListener('click',e=>{if(!m.hidden&&!m.contains(e.target))menuOpen(false)});
m.onkeydown=e=>{const items=[...m.children],i=items.indexOf(document.activeElement);
if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus()}
else if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus()}
else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(i>=0)pickFromMenu(items[i].dataset.code)}
else if(e.key==='Escape'||e.key==='Tab'){menuOpen(false);b.focus()}}}
function langButtons(){const m=document.getElementById('langMenu');if(!m.children.length)initLangMenu();
[...m.children].forEach(li=>li.setAttribute('aria-selected',li.dataset.code===lang));
document.getElementById('langCur').textContent=LANGS.find(([c])=>c===lang)[1];themeBtn();const f=FOOT[lang];document.getElementById('fp').textContent=f[0];
document.getElementById('fd').textContent=f[1];
document.getElementById('fp').href='privacy-policy.html?lang='+lang;document.getElementById('fd').href='delete-account.html?lang='+lang}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function para(s){return esc(s).split(/\n\n+/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}

/* ═══ BACKEND DASTURCHI SOZLAYDI ═══
   API_BASE — Go backend manzili (shu sahifa bilan bir domenda bo'lsa '' qoldiring, aks holda CORS'ga ruxsat bering).
   Forma akkauntni O'CHIRMAYDI, faqat so'rov yaratadi (admin telefon orqali tasdiqlagach o'chiradi):
   POST /v1/account-deletion-requests {login,password,phone,lang} -> 202. 401 parol xato, 409 so'rov bor, 429 limit.
   SUPPORT — parolsiz (Google) foydalanuvchilar uchun aloqa: email yoki Telegram havolasi. */
const CONFIG={API_BASE:'',SUPPORT_HREF:'mailto:coderxqwerty@gmail.com',SUPPORT_LABEL:'coderxqwerty@gmail.com'};
let state='';
function render(){const t=T[lang];document.documentElement.lang=lang;document.title='Qarznoma — '+t.title;langButtons();
document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=t[el.dataset.t]});
document.getElementById('what').innerHTML=t.what.map(x=>'<li>'+esc(x)+'</li>').join('');
const c=document.getElementById('contact');c.href=CONFIG.SUPPORT_HREF;c.querySelector('span').textContent=CONFIG.SUPPORT_LABEL;
const p=document.getElementById('privacy');p.href='privacy-policy.html?lang='+lang;p.textContent=t.privacy_link+' →';
showMsg(state)}
function showMsg(k){state=k;const m=document.getElementById('msg');const t=T[lang];m.textContent=k?t[k]:'';
m.className='msg '+(k==='ok'?'ok':'err')}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const t=T[lang];
const login=document.getElementById('login').value.trim(),pw=document.getElementById('password').value,
phone=document.getElementById('phone').value.trim();
if(!login||!pw||phone.replace(/\D/g,'').length<7||!document.getElementById('agree').checked){showMsg('err_fill');return}
const btn=document.getElementById('go');btn.disabled=true;btn.textContent=t.working;showMsg('');
try{const r=await fetch(CONFIG.API_BASE+'/v1/account-deletion-requests',{method:'POST',
headers:{'Content-Type':'application/json'},body:JSON.stringify({login,password:pw,phone,lang})});
if(r.ok){showMsg('ok');document.getElementById('f').reset()}
else if(r.status===401)showMsg('err_creds');else if(r.status===409)showMsg('err_exists');
else if(r.status===429)showMsg('err_limit');else showMsg('err_generic')}
catch(err){showMsg('err_generic')}
finally{btn.disabled=false;btn.textContent=T[lang].submit}});
render();</script>
</body>
</html>

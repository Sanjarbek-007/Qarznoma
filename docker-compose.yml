services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qarznoma
      POSTGRES_USER: qarznoma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qarznoma"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://qarznoma:${POSTGRES_PASSWORD}@db:5432/qarznoma?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8080"]   # put Caddy/Nginx (HTTPS) in front
    restart: unless-stopped

volumes:
  pgdata:
